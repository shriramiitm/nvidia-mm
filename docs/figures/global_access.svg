<text x='20.0' y='300.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='400'>naive efficiency = (64 + 8) bytes used / (64 + 64) fetched = 56.25%  — exactly the value Nsight Compute reports</text>
<text x='20.0' y='318.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='start' font-weight='400'>If threadIdx.x mapped to rows instead, every thread would hit its own sector: 4 of 32 bytes used (12.5%).</text>
