<text x='480.0' y='174.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#ffffff' text-anchor='middle' font-weight='600'>t</text>
<rect x='560.0' y='150.0' width='160.0' height='160.0' rx='0' fill='#f1f0ec' fill-opacity='1' stroke='#c9c8c2' stroke-width='1'/>
<text x='640.0' y='330.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#0b0b0b' text-anchor='middle' font-weight='600'>C (M × N)</text>
<rect x='620.0' y='210.0' width='40.0' height='40.0' rx='0' fill='#1baf7a' fill-opacity='1' stroke='#1baf7a' stroke-width='1'/>
