<svg xmlns='http://www.w3.org/2000/svg' width='820' height='400' viewBox='0 0 820 400'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#8a8984'/></marker></defs>
<rect width='100%' height='100%' fill='#fcfcfb'/>
<text x='20.0' y='28.0' font-family='Helvetica, Arial, sans-serif' font-size='15' fill='#0b0b0b' text-anchor='start' font-weight='600'>Tiled kernel: one block = one T×T tile of C, one thread = one element</text>
<text x='20.0' y='48.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='start' font-weight='400'>The block walks along K in steps of T, loading one tile of A and one of B into shared memory per step.</text>
