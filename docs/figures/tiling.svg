<text x='160.0' y='330.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#0b0b0b' text-anchor='middle' font-weight='600'>A (M × K)</text>
<rect x='40.0' y='210.0' width='40.0' height='40.0' rx='0' fill='#d6e6f8' fill-opacity='0.85' stroke='#2a78d6' stroke-width='1'/>
