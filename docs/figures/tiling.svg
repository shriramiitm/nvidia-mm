<line x1='620.0' y1='226.0' x2='660.0' y2='226.0' stroke='#ffffff' stroke-width='0.7'/>
<line x1='644.0' y1='210.0' x2='644.0' y2='250.0' stroke='#ffffff' stroke-width='0.7'/>
<line x1='620.0' y1='234.0' x2='660.0' y2='234.0' stroke='#ffffff' stroke-width='0.7'/>
<line x1='652.0' y1='210.0' x2='652.0' y2='250.0' stroke='#ffffff' stroke-width='0.7'/>
<line x1='620.0' y1='242.0' x2='660.0' y2='242.0' stroke='#ffffff' stroke-width='0.7'/>
<text x='640.0' y='202.0' font-family='Helvetica, Arial, sans-serif' font-size='10' fill='#52514e' text-anchor='middle' font-weight='400'>block (bx, by)</text>
<line x1='690.0' y1='248.0' x2='664.0' y2='232.0' stroke='#8a8984' stroke-width='1.5' marker-end='url(#arr)'/>
<text x='692.0' y='252.0' font-family='Helvetica, Arial, sans-serif' font-size='10' fill='#52514e' text-anchor='start' font-weight='400'>thread (tx, ty)</text>
<text x='692.0' y='264.0' font-family='Helvetica, Arial, sans-serif' font-size='10' fill='#52514e' text-anchor='start' font-weight='400'>→ C[row][col]</text>
<text x='20.0' y='352.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='400'>row = by·T + ty,   col = bx·T + tx      (tx varies fastest inside a warp → neighbouring columns)</text>
<text x='20.0' y='372.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='400'>step t:  As[ty][tx] = A[row][t·T + tx],   Bs[ty][tx] = B[t·T + ty][col]   (0 outside the matrix)</text>
<text x='20.0' y='392.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='400'>then __syncthreads();  acc += Σk As[ty][k]·Bs[k][tx];  __syncthreads();   C[row][col] = acc if inside</text>
</svg>
