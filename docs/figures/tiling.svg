<rect x='240.0' y='210.0' width='40.0' height='40.0' rx='0' fill='#d6e6f8' fill-opacity='0.85' stroke='#2a78d6' stroke-width='1'/>
<text x='140.0' y='234.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#ffffff' text-anchor='middle' font-weight='600'>t</text>
<text x='34.0' y='234.0' font-family='Helvetica, Arial, sans-serif' font-size='10' fill='#52514e' text-anchor='end' font-weight='400'>rows of</text>
<text x='34.0' y='246.0' font-family='Helvetica, Arial, sans-serif' font-size='10' fill='#52514e' text-anchor='end' font-weight='400'>block</text>
<rect x='340.0' y='70.0' width='200.0' height='240.0' rx='0' fill='#f1f0ec' fill-opacity='1' stroke='#c9c8c2' stroke-width='1'/>
<text x='440.0' y='62.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#0b0b0b' text-anchor='middle' font-weight='600'>B (K × N)</text>
<rect x='460.0' y='70.0' width='40.0' height='40.0' rx='0' fill='#fbdccf' fill-opacity='0.85' stroke='#eb6834' stroke-width='1'/>
<rect x='460.0' y='110.0' width='40.0' height='40.0' rx='0' fill='#fbdccf' fill-opacity='0.85' stroke='#eb6834' stroke-width='1'/>
